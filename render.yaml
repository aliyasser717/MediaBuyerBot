services:
  - type: web
    name: media-buyer-bot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_API_TOKEN
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5-mini
